[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "relay-agent-platform"
version = "0.1.0"
description = "A durable, policy-governed LangGraph workflow platform."
readme = "README.md"
requires-python = ">=3.12,<3.14"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.116,<1",
    "opentelemetry-api>=1.36,<2",
    "opentelemetry-exporter-otlp>=1.36,<2",
    "opentelemetry-instrumentation-fastapi>=0.57b0,<1",
    "opentelemetry-instrumentation-sqlalchemy>=0.57b0,<1",
    "opentelemetry-sdk>=1.36,<2",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "sqlalchemy[asyncio]>=2.0.41,<3",
    "structlog>=25.4,<26",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "import-linter>=2.3,<3",
    "mypy>=1.17,<2",
    "pre-commit>=4.2,<5",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.1,<2",
    "pytest-cov>=6.2,<8",
    "httpx>=0.28,<1",
    "ruff>=0.12,<1",
    "testcontainers[postgres]>=4.12,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_platform"]

[tool.pytest.ini_options]
minversion = "8.4"
addopts = [
    "--strict-config",
    "--strict-markers",
    "--showlocals",
    "--tb=short",
]
testpaths = ["tests"]
xfail_strict = true
markers = [
    "integration: tests that require external infrastructure",
]

[tool.pytest_asyncio]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["agent_platform"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "raise NotImplementedError",
]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A",
    "ASYNC",
    "B",
    "C4",
    "DTZ",
    "E",
    "F",
    "FAST",
    "I",
    "N",
    "PERF",
    "PIE",
    "PL",
    "PTH",
    "RUF",
    "S",
    "SIM",
    "T20",
    "TRY",
    "UP",
    "W",
]
ignore = [
    "PLR0913", # Constructor injection can require several explicit dependencies.
    "TRY003",  # Domain exceptions may carry specific, actionable messages.
]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501", "N999"]
"tests/**/*.py" = ["PLR2004", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["agent_platform"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = "src"
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "opentelemetry.*",
    "testcontainers.*",
]
ignore_missing_imports = true
